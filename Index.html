<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VKEYSWEET COLLECTION</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7fb;color:#151515}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
header{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:20px;white-space:nowrap}.brand span{color:#a78bfa}.search{flex:1;padding:11px 14px;border-radius:12px;border:0}
.hero{max-width:1100px;margin:18px auto;padding:30px 22px;border-radius:22px;background:linear-gradient(135deg,#111827,#7c3aed);color:white}.hero h1{font-size:34px;margin:0 0 8px}.hero p{margin:0;color:#e5e7eb}
.wrap{max-width:1100px;margin:auto;padding:0 16px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cats button{padding:10px 15px;border-radius:999px;background:white;border:1px solid #ddd}.cats button.active{background:#7c3aed;color:white}
.section-title{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{background:white;border-radius:16px;overflow:hidden;border:1px solid #eee}.product img{width:100%;height:190px;object-fit:cover;background:#eee}.body{padding:12px}.price{font-weight:900;font-size:18px;margin:7px 0}.add{background:#111827;color:white;padding:10px;border-radius:10px;width:100%}
.cart{position:fixed;right:18px;bottom:18px;background:#7c3aed;color:white;padding:14px 18px;border-radius:999px;box-shadow:0 8px 25px #0003}
footer{margin-top:40px;background:#111827;color:#ddd;text-align:center;padding:28px}.adminlink{color:#aaa;background:none;margin-top:12px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;place-items:center}.box{background:white;border-radius:20px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto}.admin-box{width:min(1000px,100%)}.admin-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.admin-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.admin-card{background:#f5f3ff;border-radius:14px;padding:14px}.admin-card b{font-size:24px;display:block;margin-top:5px}.admin-tab{padding:10px 13px;border:0;border-radius:10px;background:#eee}.admin-tab.active{background:#7c3aed;color:white}.admin-section{margin-top:15px}.muted{color:#666}@media(max-width:650px){.admin-cards{grid-template-columns:1fr 1fr}}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.primary{background:#7c3aed;color:white;padding:12px 16px;border-radius:10px;font-weight:700}.close{float:right;background:#eee;padding:8px 12px;border-radius:8px}
#admin{display:none}.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.admin-nav button{padding:10px 13px;border-radius:10px;background:#eee}.admin-panel{background:#fff;padding:18px;border-radius:16px;margin-top:10px}.admin-products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.admin-products img{width:100%;height:150px;object-fit:cover;border-radius:10px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.admin-products{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
@media(max-width:450px){.grid{grid-template-columns:1fr 1fr}.product img{height:150px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">VKEYSWEET <span>COLLECTION</span></div><input class="search" id="search" placeholder="🔎 Search products..." oninput="render()"></div></header>
<main id="store">
<div class="hero"><h1>Shop VKEYSWEET COLLECTION ✨</h1><p>Fashion, shoes, beauty, accessories & electronics — shop easily and order on WhatsApp.</p></div>
<div class="wrap"><div class="cats" id="cats"></div>
<div class="section-title"><h2>🛍️ Products</h2><span id="cartCount">0 items</span></div><div class="grid" id="products"></div></div>
</main>
<button class="cart" onclick="openCart()">🛒 Cart (<span id="cartNum">0</span>)</button>

<footer>© VKEYSWEET COLLECTION · WhatsApp: +234 706 462 8483<br><button class="adminlink" onclick="openAdminLogin()">🔐 Admin Login</button></footer>

<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeModal('cartModal')">✕</button><h2>🛒 Your Cart</h2><div id="cartItems"></div><hr><h3 id="total"></h3><div class="field"><label>Name</label><input id="cname" placeholder="Your name"></div><div class="field"><label>Phone number</label><input id="cphone" placeholder="080..."></div><div class="field"><label>Delivery address</label><textarea id="caddress" placeholder="Full delivery address"></textarea></div><div class="field"><label>Payment option</label><select id="payment"><option>Cash on Delivery</option><option>Bank Transfer</option><option>Other — discuss on WhatsApp</option></select></div><button class="primary" style="width:100%" onclick="whatsappOrder()">💬 Order & Pay on WhatsApp</button></div></div>

<div class="modal" id="adminLogin"><div class="box"><button class="close" onclick="closeModal('adminLogin')">✕</button><h2>🔐 Admin Login</h2><div class="field"><label>Password</label><input id="adminPass" type="password" placeholder="Enter admin password" onkeydown="if(event.key==='Enter')adminLogin()"></div><button class="primary" style="width:100%" onclick="adminLogin()">Login</button><p id="adminError" style="color:#c00"></p></div></div>

<div class="modal" id="adminModal"><div class="box admin-box"><button class="close" onclick="closeModal('adminModal')">✕</button><div id="admin"></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyDXBhZhOy7GW5601YpBtuKp6LwL7kXG_7A",authDomain:"vkeysweet-collection-7a7ad.firebaseapp.com",projectId:"vkeysweet-collection-7a7ad",storageBucket:"vkeysweet-collection-7a7ad.firebasestorage.app",messagingSenderId:"42023862015",appId:"1:42023862015:web:6261b4dec16af419f156ca"};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const ADMIN_PASSWORD="66778899";
const WA="+2347064628483";
let products=[];
let cart=JSON.parse(localStorage.getItem("vkeysweet_cart")||"[]"),cat="All",img="";
function money(n){return "₦"+Number(n).toLocaleString()}
function render(){
 const cats=["All","Fashion","Shoes","Beauty","Accessories","Electronics","More"];
 document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${cat===c?"active":""}" onclick="setCat('${c}')">${c}</button>`).join("");
 let q=document.getElementById("search").value.toLowerCase();
 let ps=products.filter(p=>(cat==="All"||p.cat===cat)&&String(p.name||"").toLowerCase().includes(q));
 document.getElementById("products").innerHTML=ps.length?ps.map(p=>`<article class="product"><img src="${p.image||""}"><div class="body"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><small>${esc(p.cat||"")} · Stock ${p.stock||0}</small><br><button class="add" onclick="addCart('${p.id}')">Add to Cart 🛒</button></div></article>`).join(""):'<p>No products yet. Check back soon.</p>';
 let count=cart.reduce((a,x)=>a+x.qty,0);document.getElementById("cartNum").textContent=count;document.getElementById("cartCount").textContent=count+" items";
}
function setCat(c){cat=c;render()}
function addCart(id){let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});saveCart();render()}
function saveCart(){localStorage.setItem("vkeysweet_cart",JSON.stringify(cart))}
function openCart(){document.getElementById("cartModal").style.display="grid";let total=0;document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>{let p=products.find(y=>y.id===x.id);if(!p)return"";total+=Number(p.price)*x.qty;return `<div style="display:flex;gap:10px;margin:12px 0;align-items:center"><img src="${p.image||""}" style="width:70px;height:70px;object-fit:cover;border-radius:10px"><div style="flex:1"><b>${esc(p.name)}</b><br>${money(p.price)} × ${x.qty}</div><button onclick="changeQty('${p.id}',-1)">−</button><button onclick="changeQty('${p.id}',1)">+</button></div>`}).join(""):'<p>Your cart is empty.</p>';document.getElementById("total").textContent="Total: "+money(total)}
function changeQty(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);saveCart();openCart();render()}
function closeModal(id){document.getElementById(id).style.display="none"}
function whatsappOrder(){
 if(!cart.length)return alert("Your cart is empty.");
 let name=document.getElementById("cname").value.trim(),phone=document.getElementById("cphone").value.trim(),address=document.getElementById("caddress").value.trim(),pay=document.getElementById("payment").value;
 if(!name||!phone||!address)return alert("Please fill in your name, phone number and delivery address.");
 let total=0,lines=cart.map(x=>{let p=products.find(y=>y.id===x.id);if(!p)return"";let sub=Number(p.price)*x.qty;total+=sub;return `• ${p.name} — Qty: ${x.qty} — ${money(sub)}`}).filter(Boolean).join("\n");
 let msg=`🛍️ VKEYSWEET COLLECTION ORDER\n\n👤 Name: ${name}\n📱 Phone: ${phone}\n📍 Address: ${address}\n\n🛒 ORDER:\n${lines}\n\n🧾 Total: ${money(total)}\n💳 Payment: ${pay}\n\nPlease confirm my order.`;
 location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
}
function openAdminLogin(){document.getElementById("adminLogin").style.display="grid";document.getElementById("adminPass").value="";document.getElementById("adminError").textContent=""}
function adminLogin(){const pass=document.getElementById("adminPass").value;if(pass===ADMIN_PASSWORD){closeModal("adminLogin");document.getElementById("adminModal").style.display="grid";showAdmin()}else document.getElementById("adminError").textContent="Wrong password."}
function showAdmin(){const admin=document.getElementById("admin");admin.style.display="block";admin.innerHTML=`<div class="admin-head"><div><h2 style="margin:0">VKEYSWEET Admin Dashboard</h2><p class="muted" style="margin:5px 0">Password-protected admin area</p></div><button class="primary" onclick="logoutAdmin()">Logout</button></div><div class="admin-cards"><div class="admin-card">Products<b>${products.length}</b></div><div class="admin-card">Orders<b>0</b></div><div class="admin-card">Flash Deals<b>0</b></div><div class="admin-card">Free Gifts<b>0</b></div></div><div class="admin-nav"><button class="admin-tab active" id="tabDashboard" onclick="adminDashboard()">📊 Dashboard</button><button class="admin-tab" id="tabAdd" onclick="adminAdd()">➕ Add Product</button><button class="admin-tab" id="tabProducts" onclick="adminList()">📦 Products</button><button class="admin-tab" onclick="adminPlaceholder('🛍️ Orders','Orders will appear here when order saving is connected.')">🛍️ Orders</button><button class="admin-tab" onclick="adminPlaceholder('🔥 Flash Deals','Flash Deals management can be added here.')">🔥 Flash Deals</button><button class="admin-tab" onclick="adminPlaceholder('🎁 Free Gifts','Free Gifts management can be added here.')">🎁 Free Gifts</button></div><div id="adminContent" class="admin-panel admin-section"></div>`;adminDashboard()}
function activateTab(id){document.querySelectorAll('.admin-tab').forEach(b=>b.classList.remove('active'));if(id){const b=document.getElementById(id);if(b)b.classList.add('active')}}
function adminDashboard(){activateTab('tabDashboard');document.getElementById('adminContent').innerHTML=`<h3>📊 Dashboard</h3><p>You are inside the VKEYSWEET admin area.</p><p>Use <b>➕ Add Product</b> to upload a product picture, name, price, category and stock. Saved products appear on the customer storefront.</p>`}
function logoutAdmin(){closeModal("adminModal")}
function adminList(){activateTab('tabProducts');document.getElementById('adminContent').innerHTML=`<h3>📦 Products (${products.length})</h3><div class="admin-products">${products.map(p=>`<div><img src="${p.image||""}"><b>${esc(p.name)}</b><br>${money(p.price)} · Stock ${p.stock||0}<br><button style="margin-top:7px;padding:7px 10px;border-radius:8px;background:#fee2e2;color:#991b1b" onclick="delProduct('${p.id}')">Delete</button></div>`).join("")||"<p>No products yet.</p>"}</div>`}
function adminAdd(){activateTab('tabAdd');document.getElementById('adminContent').innerHTML=`<h3>➕ Add Product</h3><div class="field"><label>Product Picture</label><input type="file" accept="image/*" onchange="readImg(event)"></div><img id="aPreview" style="display:none;width:100%;height:180px;object-fit:cover;border-radius:10px"><div class="field"><label>Product Name</label><input id="an" placeholder="e.g. Sneakers"></div><div class="field"><label>Price (₦)</label><input id="ap" type="number" placeholder="e.g. 15000"></div><div class="field"><label>Category</label><select id="ac"><option>Fashion</option><option>Shoes</option><option>Beauty</option><option>Accessories</option><option>Electronics</option><option>More</option></select></div><div class="field"><label>Stock</label><input id="as" type="number" placeholder="e.g. 10"></div><button class="primary" onclick="saveProduct()">💾 Save Product</button>`}
function adminPlaceholder(title,text){document.querySelectorAll('.admin-tab').forEach(b=>b.classList.remove('active'));document.getElementById('adminContent').innerHTML=`<h3>${title}</h3><p>${text}</p>`}
function readImg(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{img=r.result;let p=document.getElementById('aPreview');p.src=img;p.style.display='block'};r.readAsDataURL(f)}
async function saveProduct(){let n=document.getElementById('an').value.trim(),p=Number(document.getElementById('ap').value),c=document.getElementById('ac').value,s=Number(document.getElementById('as').value||0);if(!n||!p||!img)return alert('Add picture, name and price.');try{await addDoc(collection(db,'products'),{name:n,price:p,cat:c,stock:s,image:img,createdAt:Date.now()});img='';alert('Product added! It is now online.');adminList()}catch(e){alert('Could not save product. Make sure Firestore is enabled and its rules allow the admin to write.');console.error(e)}}
async function delProduct(id){try{await deleteDoc(doc(db,'products',id));adminList()}catch(e){alert('Could not delete product.');console.error(e)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

onSnapshot(query(collection(db,"products"),orderBy("createdAt","desc")),snap=>{products=snap.docs.map(d=>({id:d.id,...d.data()}));render();if(document.getElementById("adminContent"))adminList()},err=>{console.error(err);document.getElementById("products").innerHTML='<p>Store database is not connected yet. Please enable Firestore.</p>'});

Object.assign(window,{render,setCat,addCart,openCart,changeQty,closeModal,whatsappOrder,openAdminLogin,adminLogin,showAdmin,adminList,logoutAdmin,adminAdd,readImg,saveProduct,delProduct,esc});
render();
</script>
</body></html>
