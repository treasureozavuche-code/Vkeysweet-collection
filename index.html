<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VKEYSWEET COLLECTION</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7fb;color:#151515}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}
header{background:#111827;color:white;padding:16px;position:sticky;top:0;z-index:5}.bar{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px}.brand{font-weight:900;font-size:20px;white-space:nowrap}.brand span{color:#a78bfa}.search{flex:1;padding:11px 14px;border-radius:12px;border:0}
.hero{max-width:1100px;margin:18px auto;padding:30px 22px;border-radius:22px;background:linear-gradient(135deg,#111827,#7c3aed);color:white}.hero h1{font-size:34px;margin:0 0 8px}.hero p{margin:0;color:#e5e7eb}
.wrap{max-width:1100px;margin:auto;padding:0 16px}.cats{display:flex;gap:8px;overflow:auto;padding:12px 0}.cats button{padding:10px 15px;border-radius:999px;background:white;border:1px solid #ddd}.cats button.active{background:#7c3aed;color:white}
.section-title{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.product{background:white;border-radius:16px;overflow:hidden;border:1px solid #eee}.product img{width:100%;height:190px;object-fit:cover;background:#eee}.body{padding:12px}.price{font-weight:900;font-size:18px;margin:7px 0}.add{background:#111827;color:white;padding:10px;border-radius:10px;width:100%}
.cart{position:fixed;right:18px;bottom:18px;background:#7c3aed;color:white;padding:14px 18px;border-radius:999px;box-shadow:0 8px 25px #0003}
footer{margin-top:40px;background:#111827;color:#ddd;text-align:center;padding:28px}.adminlink{color:#aaa;background:none;margin-top:12px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:20px;place-items:center}.box{background:white;border-radius:20px;padding:22px;width:min(600px,100%);max-height:90vh;overflow:auto}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}.primary{background:#7c3aed;color:white;padding:12px 16px;border-radius:10px;font-weight:700}.close{float:right;background:#eee;padding:8px 12px;border-radius:8px}
#admin{display:none}.admin-nav{display:flex;gap:8px;flex-wrap:wrap;margin:15px 0}.admin-nav button{padding:10px 13px;border-radius:10px;background:#eee}.admin-panel{background:#fff;padding:18px;border-radius:16px;margin-top:10px}.admin-products{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.admin-products img{width:100%;height:150px;object-fit:cover;border-radius:10px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.admin-products{grid-template-columns:repeat(2,1fr)}.bar{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
@media(max-width:450px){.grid{grid-template-columns:1fr 1fr}.product img{height:150px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">VKEYSWEET <span>COLLECTION</span></div><input class="search" id="search" placeholder="🔎 Search products..." oninput="render()"></div></header>
<main id="store">
<div class="hero"><h1>Shop VKEYSWEET COLLECTION ✨</h1><p>Fashion, shoes, beauty, accessories & electronics — shop easily and order on WhatsApp.</p></div>
<div class="wrap"><div class="cats" id="cats"></div>
<div class="section-title"><h2>🛍️ Products</h2><span id="cartCount">0 items</span></div><div class="grid" id="products"></div></div>
</main>
<button class="cart" onclick="openCart()">🛒 Cart (<span id="cartNum">0</span>)</button>

<footer>© VKEYSWEET COLLECTION · WhatsApp: +234 706 462 8483<br><button class="adminlink" onclick="openAdminLogin()">🔐 Admin Login</button></footer>

<div class="modal" id="cartModal"><div class="box"><button class="close" onclick="closeModal('cartModal')">✕</button><h2>🛒 Your Cart</h2><div id="cartItems"></div><hr><h3 id="total"></h3><div class="field"><label>Name</label><input id="cname" placeholder="Your name"></div><div class="field"><label>Phone number</label><input id="cphone" placeholder="080..."></div><div class="field"><label>Delivery address</label><textarea id="caddress" placeholder="Full delivery address"></textarea></div><div class="field"><label>Payment option</label><select id="payment"><option>Cash on Delivery</option><option>Bank Transfer</option><option>Other — discuss on WhatsApp</option></select></div><button class="primary" style="width:100%" onclick="whatsappOrder()">💬 Order & Pay on WhatsApp</button></div></div>

<div class="modal" id="adminLogin"><div class="box"><button class="close" onclick="closeModal('adminLogin')">✕</button><h2>🔐 Admin Login</h2><div class="field"><label>Password</label><input id="adminPass" type="password"></div><button class="primary" onclick="adminLogin()">Login</button><p id="adminError" style="color:#c00"></p></div></div>

<div class="modal" id="adminModal"><div class="box"><button class="close" onclick="closeModal('adminModal')">✕</button><div id="admin"></div></div></div>

<script>
const PASS="66778899", WA="+234 706 462 8483";
let products=JSON.parse(localStorage.getItem("vkeysweet_products")||"[]"), cart=JSON.parse(localStorage.getItem("vkeysweet_cart")||"[]"), cat="All", img="";
function money(n){return "₦"+Number(n).toLocaleString()}
function render(){
 const cats=["All","Fashion","Shoes","Beauty","Accessories","Electronics","More"];
 document.getElementById("cats").innerHTML=cats.map(c=>`<button class="${cat===c?"active":""}" onclick="cat='${c}';render()">${c}</button>`).join("");
 let q=document.getElementById("search").value.toLowerCase();
 let ps=products.filter(p=>(cat==="All"||p.cat===cat)&&p.name.toLowerCase().includes(q));
 document.getElementById("products").innerHTML=ps.length?ps.map(p=>`<article class="product"><img src="${p.image}"><div class="body"><b>${esc(p.name)}</b><div class="price">${money(p.price)}</div><small>${esc(p.cat)} · Stock ${p.stock}</small><br><button class="add" onclick="addCart(${p.id})">Add to Cart 🛒</button></div></article>`).join(""):'<p>No products yet. Check back soon.</p>';
 let count=cart.reduce((a,x)=>a+x.qty,0);document.getElementById("cartNum").textContent=count;document.getElementById("cartCount").textContent=count+" items";
}
function addCart(id){let x=cart.find(x=>x.id===id);if(x)x.qty++;else cart.push({id,qty:1});save();render()}
function save(){localStorage.setItem("vkeysweet_products",JSON.stringify(products));localStorage.setItem("vkeysweet_cart",JSON.stringify(cart))}
function openCart(){document.getElementById("cartModal").style.display="grid";let total=0;document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>{let p=products.find(y=>y.id===x.id);if(!p)return"";total+=p.price*x.qty;return `<div style="display:flex;gap:10px;margin:12px 0;align-items:center"><img src="${p.image}" style="width:70px;height:70px;object-fit:cover;border-radius:10px"><div style="flex:1"><b>${esc(p.name)}</b><br>${money(p.price)} × ${x.qty}</div><button onclick="changeQty(${p.id},-1)">−</button><button onclick="changeQty(${p.id},1)">+</button></div>`}).join(""):'<p>Your cart is empty.</p>';document.getElementById("total").textContent="Total: "+money(total)}
function changeQty(id,d){let x=cart.find(x=>x.id===id);if(!x)return;x.qty+=d;if(x.qty<=0)cart=cart.filter(x=>x.id!==id);save();openCart();render()}
function closeModal(id){document.getElementById(id).style.display="none"}
function whatsappOrder(){
 if(!cart.length)return alert("Your cart is empty.");
 let name=document.getElementById("cname").value.trim(),phone=document.getElementById("cphone").value.trim(),address=document.getElementById("caddress").value.trim(),pay=document.getElementById("payment").value;
 if(!name||!phone||!address)return alert("Please fill in your name, phone number and delivery address.");
 let total=0, lines=cart.map(x=>{let p=products.find(y=>y.id===x.id);let sub=p.price*x.qty;total+=sub;return `• ${p.name} — Qty: ${x.qty} — ${money(sub)}`}).join("\n");
 let msg=`🛍️ VKEYSWEET COLLECTION ORDER\n\n👤 Name: ${name}\n📱 Phone: ${phone}\n📍 Address: ${address}\n\n🛒 ORDER:\n${lines}\n\n🧾 Total: ${money(total)}\n💳 Payment: ${pay}\n\nPlease confirm my order.`;
 location.href="https://wa.me/"+WA+"?text="+encodeURIComponent(msg);
}
function openAdminLogin(){document.getElementById("adminLogin").style.display="grid"}
function adminLogin(){if(document.getElementById("adminPass").value!==PASS){document.getElementById("adminError").textContent="Wrong password.";return}closeModal("adminLogin");document.getElementById("adminModal").style.display="grid";showAdmin()}
function showAdmin(){document.getElementById("admin").style.display="block";document.getElementById("admin").innerHTML=`<h2>VKEYSWEET Admin</h2><div class="admin-nav"><button onclick="adminAdd()">➕ Add Product</button><button onclick="adminList()">📦 Products</button></div><div id="adminContent" class="admin-panel"></div>`;adminList()}
function adminList(){document.getElementById("adminContent").innerHTML=`<h3>Products (${products.length})</h3><div class="admin-products">${products.map(p=>`<div><img src="${p.image}"><b>${esc(p.name)}</b><br>${money(p.price)} · Stock ${p.stock}<br><button class="danger" style="margin-top:7px;padding:7px" onclick="delProduct(${p.id})">Delete</button></div>`).join("")||"<p>No products.</p>"}</div>`}
function adminAdd(){document.getElementById("adminContent").innerHTML=`<h3>➕ Add Product</h3><div class="field"><label>Picture</label><input type="file" accept="image/*" onchange="readImg(event)"></div><img id="aPreview" style="display:none;width:100%;height:180px;object-fit:cover;border-radius:10px"><div class="field"><label>Name</label><input id="an"></div><div class="field"><label>Price</label><input id="ap" type="number"></div><div class="field"><label>Category</label><select id="ac"><option>Fashion</option><option>Shoes</option><option>Beauty</option><option>Accessories</option><option>Electronics</option><option>More</option></select></div><div class="field"><label>Stock</label><input id="as" type="number"></div><button class="primary" onclick="saveProduct()">Save Product</button>`}
function readImg(e){let r=new FileReader();r.onload=()=>{img=r.result;let p=document.getElementById("aPreview");p.src=img;p.style.display="block"};r.readAsDataURL(e.target.files[0])}
function saveProduct(){let n=document.getElementById("an").value.trim(),p=Number(document.getElementById("ap").value),c=document.getElementById("ac").value,s=Number(document.getElementById("as").value);if(!n||!p||!img)return alert("Add picture, name and price.");products.push({id:Date.now(),name:n,price:p,cat:c,stock:s,image:img});save();img="";render();adminList();alert("Product added!")}
function delProduct(id){products=products.filter(p=>p.id!==id);save();render();adminList()}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
render();
</script>
</body></html>
